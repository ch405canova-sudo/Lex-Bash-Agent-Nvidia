name: lex CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ncat shellcheck

      - name: Bash-Version
        run: bash --version | head -1

      - name: Syntax (bash -n)
        run: |
          bash -n lex
          for f in test/*.sh tools/*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -S warning lex test/*.sh tools/*.sh

      - name: Tests
        run: ./test/run_all.sh

      # `if: always()` — Fund M12 (2026-10-08): ohne den Guard sprang der
      # Hygiene-Schritt bei Test-Failure aus → ein Prozess-Leak nach einem
      # roten Lauf blieb unsichtbar. Muster: alle Listener, die die Suite
      # überhaupt erzeugen kann (ncat-Listener + Fake-HTTP-Server auf den
      # Test-Ports 246xx + der markierte exec-sleep-Langläufer aus
      # fake_mcp.sh, dessen argv[0] `fake_mcp_hang` ist).
      - name: Hygiene (keine Test-Reste)
        if: always()
        run: |
          leaks=""
          for pat in 'ncat --li[s]ten' 'http[.]server 246[0-9][0-9]' 'fake_mcp[_]hang'; do
            if pgrep -af "$pat" >/dev/null 2>&1; then
              leaks="${leaks}Muster ${pat}:"$'\n'"$(pgrep -af "$pat")"$'\n'
            fi
          done
          if [[ -n "$leaks" ]]; then
            echo "Fehler: Test-Prozesse noch aktiv:" >&2
            printf '%s' "$leaks" >&2
            exit 1
          fi
          echo "sauber"
